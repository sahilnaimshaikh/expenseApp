name: expense_tracker
description: "Offline-first personal expense tracker."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.5.1
  go_router: 14.2.0
  isar: ^3.1.8
  isar_flutter_libs: ^3.1.8
  path_provider: 2.1.3
  fl_chart: 0.68.0
  flutter_local_notifications: 17.2.1+2
  decimal: 3.0.2
  intl: 0.19.0
  archive: 3.6.1
  csv: 6.0.0
  excel: 4.0.6
  share_plus: 9.0.0
  file_picker: 8.0.6
  flutter_colorpicker: 1.1.0
  workmanager: 0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  glados: 1.1.7
  mocktail: 1.0.4
  path: 1.9.1

flutter:
  uses-material-design: true
